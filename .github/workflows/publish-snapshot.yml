name: Publish GameSnapshot sources

on:
  workflow_call:
    inputs:
      runner_label:
        description: Unique label of the JIT runner reserved for this publication
        required: true
        type: string
      snapshot_path:
        description: Absolute path to the sealed GameSnapshot on the runner host
        required: true
        type: string
      expected_snapshot_id:
        description: GameSnapshot identity returned by the builder
        required: true
        type: string
      expected_descriptor_sha256:
        description: SHA-256 of snapshot.json returned by the builder
        required: true
        type: string
      expected_profile:
        description: Snapshot build profile
        required: true
        type: string
      target:
        description: Configured game target
        required: true
        type: string
      branch:
        description: Pure-data branch to update
        required: true
        type: string
    outputs:
      commit_sha:
        description: Published data commit
        value: ${{ jobs.publish.outputs.commit_sha }}
      publication_state:
        description: Whether the data branch changed
        value: ${{ jobs.publish.outputs.publication_state }}
      version_name:
        description: Published game version
        value: ${{ jobs.publish.outputs.version_name }}

permissions:
  contents: read

concurrency:
  group: wot-src-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.target }} to ${{ inputs.branch }}
    environment: selectel
    env:
      PYTHONUNBUFFERED: "1"
    runs-on:
      - self-hosted
      - ${{ inputs.runner_label }}
    timeout-minutes: 60
    outputs:
      commit_sha: ${{ steps.publish.outputs.commit_sha }}
      publication_state: ${{ steps.publish.outputs.publication_state }}
      version_name: ${{ steps.publish.outputs.version_name }}
    steps:
      - name: Mint data-repository token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: wot-src
          permission-contents: write

      - name: Check out the pinned publisher
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.28"
          python-version: "3.13.14"

      - name: Install publisher
        shell: bash
        run: uv sync --frozen --no-dev

      - name: Configure data-branch commit identity
        shell: bash
        run: |
          git config user.name "wotstat snapshot publisher"
          git config user.email "snapshot-publisher@users.noreply.github.com"

      - name: Verify, project, stage, commit and push
        id: publish
        shell: bash
        env:
          DATA_BRANCH: ${{ inputs.branch }}
          DESCRIPTOR_SHA256: ${{ inputs.expected_descriptor_sha256 }}
          SNAPSHOT_ID: ${{ inputs.expected_snapshot_id }}
          SNAPSHOT_PATH: ${{ inputs.snapshot_path }}
          SNAPSHOT_PROFILE: ${{ inputs.expected_profile }}
          TARGET: ${{ inputs.target }}
        run: |
          set -Eeuo pipefail
          uv run --no-sync wot-src-publisher publish \
            --repository "${GITHUB_WORKSPACE}" \
            --snapshot "${SNAPSHOT_PATH}" \
            --target "${TARGET}" \
            --branch "${DATA_BRANCH}" \
            --expected-snapshot-id "${SNAPSHOT_ID}" \
            --expected-descriptor-sha256 "${DESCRIPTOR_SHA256}" \
            --expected-profile "${SNAPSHOT_PROFILE}"
